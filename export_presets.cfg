[preset.0]
name="Web"
platform="Web"
runnable=true
export_path="build/web/index.html"
export_filter="all_resources"
include_filter="assets/manifest.json,config/game.json,rigs/*/*.json"
exclude_filter="build/*,tools/*"
[preset.0.options]
variant/thread_support=false

[preset.1]
name="Android"
platform="Android"
runnable=true
export_path="build/android/ember-godot.apk"
export_filter="all_resources"
include_filter="assets/manifest.json,config/game.json,rigs/*/*.json"
exclude_filter="build/*,tools/*,node_modules/*"
[preset.1.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
keystore/debug="/Users/ctop/.android/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
package/unique_name="com.yuen7.ember.godot"
package/name="烬刃·Godot版"
package/signed=true
version/code=2
version/name="0.2.0"
launcher_icons/main_192x192="res://assets/ui/app-icon.png"
launcher_icons/adaptive_foreground_432x432="res://assets/icon/adaptive_fg_empty.png"
launcher_icons/adaptive_background_432x432="res://assets/icon/adaptive_bg.png"
screen/immersive_mode=true
permissions/internet=false
